// Root build file — DukaFlow Mobile (Flutter 3.22 template layout).
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    // AGP 8 requires a namespace — legacy plugins (e.g. bluetooth_print) only
    // declare `package` in their manifest. Register the shim BEFORE any
    // evaluationDependsOn below, otherwise the project is already evaluated
    // and afterEvaluate throws.
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group.toString()
                }
            }
        }
    }

    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
